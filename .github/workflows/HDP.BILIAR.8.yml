
name: HDP BALAP MOBIL 3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HDP_BALAP_3D_APK_FINAL.zip'
      - '.github/workflows/HDP.BILIAR.8.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build HDP Balap Mobil 3D
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and verify correct game
        run: |
          set -e
          test -f HDP_BALAP_3D_APK_FINAL.zip
          mkdir project
          unzip -oq HDP_BALAP_3D_APK_FINAL.zip -d project
          test -s project/index.html
          test -s project/package.json
          test -s project/capacitor.config.json
          test -s project/assets/icon-only.png
          test -s project/assets/icon-foreground.png
          test -s project/assets/icon-background.png
          grep -q 'HDP_CARS' project/index.html

      - name: Prepare web assets
        working-directory: project
        run: |
          set -e
          mkdir -p www/icons
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          cp icons/* www/icons/

      - name: Install dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Generate HDP app icons
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HDP-BALAP-3D-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
