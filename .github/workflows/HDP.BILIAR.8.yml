name: HDP.BILIAR.8 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HDP.BILIAR.8.zip'
      - '.github/workflows/HDP.BILIAR.8.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build HDP Balap Mobil 3D
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and verify game package
        shell: bash
        run: |
          set -euo pipefail

          test -f HDP.BILIAR.8.zip
          mkdir -p project
          unzip -oq HDP.BILIAR.8.zip -d project

          test -f project/index.html
          test -f project/package.json
          test -f project/capacitor.config.json
          test -f project/assets/icon-only.png
          test -f project/assets/splash.png
          test -f project/manifest.webmanifest
          test -f project/sw.js

      - name: Prepare game assets
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p www/icons
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          cp icons/* www/icons/

          curl --fail --location --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js \
            -o www/three.min.js

          test -s www/three.min.js

      - name: Install dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Generate app icons
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HDP-BALAP-3D-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
