
name: HDP BALAP 3D APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'HDP_BALAP_3D_APK.zip'
      - '.github/workflows/HDP.BILIAR.8.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build HDP Balap Mobil 3D
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract and verify game package
        shell: bash
        run: |
          set -euo pipefail
          test -f HDP_BALAP_3D_APK.zip
          mkdir -p project
          unzip -oq HDP_BALAP_3D_APK.zip -d project
          test -f project/index.html
          test -f project/package.json
          test -f project/capacitor.config.json
          test -f project/assets/icon-only.png
          test -f project/manifest.webmanifest
          test -f project/sw.js

      - name: Prepare official HDP racing icon layers
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y python3-pil
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          assets = Path('assets')
          source = Image.open(assets / 'icon-only.png').convert('RGBA')
          source = source.resize((1024, 1024), Image.Resampling.LANCZOS)

          foreground = Image.new('RGBA', (1024, 1024), (0, 0, 0, 0))
          artwork = source.resize((680, 680), Image.Resampling.LANCZOS)
          foreground.alpha_composite(
              artwork, ((1024 - 680) // 2, (1024 - 680) // 2)
          )
          foreground.save(assets / 'icon-foreground.png')

          background = Image.new('RGB', (1024, 1024), '#061A46')
          background.save(assets / 'icon-background.png')

          splash = Image.new('RGB', (2732, 2732), '#061A46')
          splash_art = source.convert('RGB').resize(
              (2100, 2100), Image.Resampling.LANCZOS
          )
          splash.paste(
              splash_art, ((2732 - 2100) // 2, (2732 - 2100) // 2)
          )
          splash.save(assets / 'splash.png')
          PY

      - name: Prepare game web assets
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p www/icons
          cp index.html www/index.html
          cp manifest.webmanifest www/manifest.webmanifest
          cp sw.js www/sw.js
          cp icons/* www/icons/
          curl --fail --location --retry 3 \
            https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js \
            -o www/three.min.js
          test -s www/three.min.js

      - name: Install dependencies
        working-directory: project
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        working-directory: project
        run: npx cap add android

      - name: Sync Android
        working-directory: project
        run: npx cap sync android

      - name: Generate Android icons and splash
        working-directory: project
        run: npx capacitor-assets generate --android

      - name: Build APK
        working-directory: project/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HDP-BALAP-3D-APK
          path: project/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
